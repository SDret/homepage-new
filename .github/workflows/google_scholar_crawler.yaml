name: Update Scholar Citations

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: scholar-citations
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Scholar reader
        run: |
          python -m pip install "scholarly==1.7.11" "bibtexparser==1.4.1"
          python -c "from bibtexparser.bibdatabase import BibDatabase; print('BibTeX dependency OK')"

      - name: Read public Scholar profile
        timeout-minutes: 3
        env:
          GOOGLE_SCHOLAR_ID: "Ch18_eIAAAAJ"
        run: |
          python -u - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          print("[1/4] Importing scholarly...", flush=True)
          from scholarly import scholarly

          scholarly.set_timeout(20)
          scholarly.set_retries(1)

          scholar_id = os.environ["GOOGLE_SCHOLAR_ID"]

          print("[2/4] Requesting public Scholar profile...", flush=True)
          author = scholarly.search_author_id(scholar_id)

          print("[3/4] Reading citation indices and publications...", flush=True)
          author = scholarly.fill(
              author,
              sections=["indices", "publications"]
          )

          print("[4/4] Validating and writing citation cache...", flush=True)

          if "citedby" not in author or not author.get("publications"):
              raise RuntimeError(
                  "Incomplete Scholar response. Previous cache will not be overwritten."
              )

          publications = []

          for paper in author["publications"]:
              title = paper.get("bib", {}).get("title")
              citations = paper.get("num_citations")

              if not title or citations is None:
                  continue

              publications.append({
                  "id": paper.get("author_pub_id") or title,
                  "title": title,
                  "citations": int(citations)
              })

          if not publications:
              raise RuntimeError(
                  "No valid publications. Previous cache will not be overwritten."
              )

          def optional_int(value):
              return int(value) if value is not None else None

          result = {
              "scholar_id": scholar_id,
              "updated_at": datetime.now(timezone.utc).isoformat(),
              "total_citations": int(author["citedby"]),
              "h_index": optional_int(author.get("hindex")),
              "i10_index": optional_int(author.get("i10index")),
              "publications": publications
          }

          with open("/tmp/citation-data.json", "w", encoding="utf-8") as file:
              json.dump(result, file, ensure_ascii=False, indent=2)

          print("SUCCESS: fetched", len(publications), "publications.", flush=True)
          print("Total citations:", result["total_citations"], flush=True)
          PY

      - name: Save successful data to citation-data branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git fetch --depth=1 origin citation-data:refs/remotes/origin/citation-data; then
            git checkout -B citation-data origin/citation-data
          else
            git checkout --orphan citation-data
            git rm -rf .
          fi

          cp /tmp/citation-data.json citation-data.json
          git add citation-data.json

          if git diff --cached --quiet; then
            exit 0
          fi

          git commit -m "Update Google Scholar citation cache"
          git push origin HEAD:citation-data
