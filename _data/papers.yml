  code: "https://github.com/SDret/A-Solution-to-Co-occurrence-Bias-Attributes-Disentanglement-via-Mutual-Information-Minimization-for"
  takeaway: "Learn attribute-specific evidence instead of unstable co-occurrence shortcuts."
  summary: "Attribute-disentangled feature learning minimizes information shared across attribute-specific representations. This journal study extends the co-occurrence-bias framework with improved feature-space exploration, treatment of imbalance, and flexibility to preserve selected causal dependencies."

- title: "Pedestrian Attribute Recognition as Label-balanced Multi-label Learning"
  display_order: 40
  year: 2024
