  code: "https://github.com/SDret/Pedestrian-Attribute-Recognition-as-Label-balanced-Multi-label-Learning"
  takeaway: "Balance attributes independently in feature space."
  summary: "Feature re-sampled detached learning balances each attribute without distorting the label priors of co-occurring attributes. Gradient-oriented augment translating further addresses feature noise and semantic imbalance, combining independent balancing and augmentation with minimal computational overhead."

- title: "A Solution to Co-occurrence Bias in Pedestrian Attribute Recognition: Theory, Algorithms, and Improvements"
  display_order: 20
  year: 2025
  venue: "IJCV 2025"
  status: "Published"
  role: "first"
  topic: "representation"
  image: "zhou2025cooccurrence.png"
