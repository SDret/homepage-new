- title: "Can the Parts Fool the Test? Counterfactual Pairing Cycles for Relational OOD"
  display_order: 70
  year: 2026
  venue: "NeurIPS 2026"
  status: "Accepted"
  role: "first"
  topic: "evaluation"
  image: "fig04-counterfactual.png"
  url: "https://arxiv.org/abs/2610.23248"
  code: "https://github.com/SDret/Official-Implementation-of-Neurips-2026-paper-Can-the-Parts-Fool-the-Test-"
  takeaway: "Keep the components fixed to isolate evidence about their pairing."
  summary: "Counterfactual pairing cycles reuse the same two images and two captions while changing only their assignment. The balanced contrast cancels image-only, text-only, and additive component shortcuts exactly, providing an evaluation primitive, a training loss, and a diagnostic for relational OOD."

- title: "Can Metadata Fix the Gauge? Calibration Turns Sparse Multi-Source Learning from Sparse PCA into Sparse Mean Recovery"
  display_order: 90
  year: 2026
  venue: "NeurIPS 2026"
  status: "Accepted"
  role: "corresponding"
  topic: "theory"
  image: "fig03-calibration.png"
  url: "https://arxiv.org/abs/2610.25663"
  takeaway: "Valid calibration metadata can restore first-order signal across sources."
  summary: "Source labels do not reveal how different sources orient their coordinates. In a sparse Gaussian model, relative-gauge metadata enables synchronization and changes the learning problem from sparse PCA to sparse mean recovery. Aligned mass quantifies the statistical value of calibration, with computational consequences under sparse-PCA hardness assumptions."

- title: "What Can Labels Alone Audit and Edit in Frozen Representations?"
  display_order: 80
  year: 2026
  venue: "NeurIPS 2026"
  status: "Accepted"
  role: "corresponding"
  topic: "theory"
  image: "fig02-label-only.png"
  url: "https://openreview.net/forum?id=5rXQteakrg"
  code: "https://github.com/Candice-x1/What-Can-Labels-Alone-Audit-and-Edit-in-Frozen-Representations-"
  takeaway: "Preserve the label-sufficient quotient before attempting residual edits."
  summary: "Labels identify a posterior quotient, rather than an arbitrary semantic/background decomposition. This motivates quotient-first auditing and editing of frozen representations. A structured second-order specialization yields dual-moment decomposition; residual editing is useful only in regimes with sufficient residual signal, support, and split stability."

- title: "Is Spurious Correlation Removal Always Learnable?"
  display_order: 60
  year: 2026
  venue: "ICML 2026"
  status: "Accepted"
  role: "first"
  topic: "theory"
  image: "zhou2026spurious.png"
  url: "https://arxiv.org/abs/2606.12930"
  takeaway: "Statistical identifiability does not guarantee efficient recovery."
  summary: "This work separates statistical identification from computational recovery in invariant learning through a conditional computational barrier. It also quantifies how environment diversity controls identifiability, estimation difficulty, and phase transitions, connecting theoretical limits with empirical diversity diagnostics."

- title: "Heterogeneous Feature Re-sampling for Balanced Pedestrian Attribute Recognition"
  display_order: 10
  year: 2025
  venue: "IEEE TPAMI 2025"
  status: "Published"
  role: "first"
  topic: "representation"
  image: "zhou2025heterogeneous.png"
