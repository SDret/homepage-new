  code: "https://github.com/SDret/Pedestrian-Attribute-Recognition-as-Label-balanced-Multi-label-Learning"
  takeaway: "Decouple label balancing from attribute co-occurrence."
  summary: "Feature-level re-sampling makes independent label balancing feasible despite image-level attribute co-occurrence. Bayesian feature augmentation adds in-distribution diversity for under-represented attributes, addressing label imbalance and semantic imbalance together."

- title: "A Solution to Co-occurrence Bias: Attributes Disentanglement via Mutual Information Minimization for Pedestrian Attribute Recognition"
  display_order: 50
