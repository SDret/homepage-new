  honor: "Long Oral"
  takeaway: "Recognize each attribute from its own visual evidence."
  summary: "Mutual-information minimization discourages attribute representations from encoding other attributes. Efficient feature transformation and recombination reduce reliance on dataset-specific co-occurrences and improve robustness under identity and scene shifts."

